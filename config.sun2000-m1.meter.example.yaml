# SUN2000 M1 + one Huawei Smartmeter, no Huawei battery.
# See docs/POLLING_PROFILE.md for coverage and workload limits.
inverter:
  host: "127.0.0.1" # Replace for an approved SDongle installation
  port: 15020
  unit_ids: [1]
  timeout_ms: 15000
  wait_after_connect_ms: 1500
server:
  listen: "127.0.0.1:1502"
web:
  listen: "127.0.0.1:8080"
  auth_enabled: true
  token: ""
polling:
  read_pause_ms: 1000
  fast_interval_s: 2
  slow_interval_s: 300
  fast_max_age_s: 30
  slow_max_age_s: 900
forward_unknown_reads: false
read_only: true # Explicit false enables writes; inverter authentication still applies
log_level: info
cache_path: cache.db
cache_ttl_h: 2
mqtt:
  enabled: false
  embedded: true
  listen: "127.0.0.1:1883"
  broker: "tcp://127.0.0.1:1883"
  username: gx
  password: ""
  topic: huawei_wechselrichter
  unit_id: 1
  interval_s: 2
  max_age_s: 30
  estimate_phase_power: false # Opt-in V * I * total PF approximation, labelled in JSON
  tls_cert: ""
  tls_key: ""
register_groups:
  - {name: fast_snapshot, address: 32000, count: 108, poll: fast, priority: 10}
  - {name: meter, address: 37100, count: 39, poll: fast}
  - {name: device_info, address: 30000, count: 35, poll: slow}
  - {name: rated_power, address: 30073, count: 4, poll: slow}
  - {name: energy_statistics, address: 32108, count: 12, poll: slow}
  - {name: inverter_config, address: 40122, count: 10, poll: slow}
  - {name: grid_mppt_config, address: 42054, count: 4, poll: slow}
  - {name: power_control, address: 47415, count: 10, poll: slow}
