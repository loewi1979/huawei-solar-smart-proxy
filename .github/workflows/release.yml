name: Publish release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: Tests and security
        run: |
          go test -race -count=1 -timeout=120s ./...
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build Linux packages
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p dist
          for arch in amd64 arm64; do
            mkdir -p "build/${arch}/huawei-solar-smart-proxy"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -buildvcs=false -trimpath -o "build/${arch}/huawei-solar-smart-proxy/huawei-solar-proxy" .
            archive="dist/huawei-solar-smart-proxy_${RELEASE_TAG}_linux_${arch}.tar"
            git archive --format=tar --prefix=huawei-solar-smart-proxy/ HEAD > "$archive"
            tar --append --file="$archive" -C "build/${arch}" huawei-solar-smart-proxy/huawei-solar-proxy
            gzip -9 "$archive"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag --title "Huawei Solar Smart Proxy ${RELEASE_TAG#v}" \
            --notes-file "docs/releases/${RELEASE_TAG}.md" --latest
